<style>

ight:1.8;white-space:pre-line}.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}.thumb{padding:0;border:2px solid transparent;aspect-ratio:4/3;overflow:hidden;background:var(--panel)}.thumb.selected{border-color:var(--accent)}.thumb img{width:100%;height:100%;object-fit:cover}.video-wheel{position:absolute;top:5px;left:50%;transform:translateX(-50%);padding:8px 12px;background:#101312dc;font-size:11px;z-index:3}#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;color:#151515;padding:18px 26px;border-radius:8px;box-shadow:0 8px 60px #0006;z-index:100;font-size:14px;text-align:center;max-width:90vw}.hidden,[hidden]{display:none!important}.broken{object-fit:contain!important;opacity:.55}@media(min-width:1200px){.grid.all{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:950px){header{flex-wrap:wrap;gap:0;padding-top:18px}.brand{width:100%}nav{margin:0;gap:22px;width:100%}nav button{padding:20px 0}.hero{gap:30px;padding-top:45px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.viewer-body{grid-template-columns:minmax(0,1fr) 210px}}@media(max-width:620px){.hero{grid-template-columns:1fr;padding-top:38px}.hero h1{font-size:64px}.hero .lead{font-size:14px}.feature-frame{aspect-ratio:4/3}.grid{gap:25px 14px}.card h3{font-size:14px}.bio{grid-template-columns:1fr;gap:10px}.section{padding:30px 0 40px}.section-head h2{font-size:29px}.viewer-body{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 165px}.side{border-left:0;border-top:1px solid var(--line);padding:12px 16px}.side p{display:none}.thumbs{display:flex;margin:10px 0 0;overflow:auto}.thumb{min-width:72px;width:72px;height:54px}.viewer-top{padding:0 12px;gap:10px}.viewer-top small{display:none}.footer-top{align-items:start}.footer-bottom{line-height:1.7}.date{display:none}.prev{left:8px}.next{right:8px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

nav{gap:34px}header{min-height:80px}.home-heading{padding:60px 0 32px;display:flex;align-items:end;justify-content:space-between;gap:20px}.home-heading h1{font-size:clamp(36px,4.7vw,70px);letter-spacing:-2.5px;font-weight:400;margin:0}.home-heading .eyebrow{margin-bottom:16px}.home-heading .archive-note{color:var(--muted);font-size:12px;line-height:1.8;text-align:right}.home-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.work-card{padding:0;display:block;position:relative;width:100%;text-align:left;overflow:hidden;border-radius:3px;background:var(--panel);aspect-ratio:4/3}.work-card>img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1);filter:brightness(1) blur(0);transition:transform 850ms cubic-bezier(.22,.61,.36,1),filter 750ms ease}.work-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:end;padding:32px;background:linear-gradient(transparent 30%,#0008);opacity:0;transition:opacity 650ms ease}.work-overlay time{font-size:12px;color:#e2e4df;letter-spacing:1.5px;margin-bottom:10px}.work-overlay h2{font-size:clamp(24px,3vw,42px);letter-spacing:-1px;font-weight:400;margin:0;color:white}.work-overlay .work-arrow{position:absolute;right:30px;bottom:30px;font-size:30px;color:white}.work-card:hover>img,.work-card:focus-visible>img{transform:scale(1.055);filter:brightness(.67) blur(.45px)}.work-card:hover .work-overlay,.work-card:focus-visible .work-overlay{opacity:1}.home-toolbar{margin:0 0 25px}.about-page{max-width:950px;padding:80px 0 50px}.about-page h1{font-size:clamp(48px,7vw,94px);font-weight:400;letter-spacing:-4px;margin:0 0 35px}.about-page .lead{max-width:650px;font-size:20px}.about-page .about-copy{font-size:16px;line-height:2;color:var(--muted);white-space:pre-line;margin:45px 0}.viewer-body{grid-template-columns:minmax(0,1fr) 240px}.stage{isolation:isolate;background:#0c0e0d}.image-viewport{position:absolute;inset:14px 14px 65px;overflow:hidden;touch-action:none;cursor:zoom-in;outline-offset:-4px!important}.image-viewport img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;transform-origin:50% 50%;will-change:transform;pointer-events:none}.image-viewport.zoomed{cursor:grab}.image-viewport.dragging{cursor:grabbing}.image-viewport.animating img{transition:transform 220ms ease}.zoom-controls{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid var(--line);border-radius:30px;background:#181c19f2;z-index:5;white-space:nowrap}.zoom-controls button{min-width:38px;height:32px;border-radius:20px;font-size:14px}.zoom-controls button:hover{background:#30382d}.zoom-controls output{font-size:11px;min-width:42px;text-align:center;color:var(--muted)}.zoom-controls .fit{padding:0 10px}.stage>.arrow{z-index:6}.viewer-top h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.side .eyebrow{font-size:11px;letter-spacing:1px}.side .thumb:focus-visible{outline-offset:1px}.viewer-caption{color:var(--muted);font-size:12px;line-height:1.8}#viewerCategory{margin-bottom:12px}

<body>
<header><button class="brand" data-nav="home"><i></i><span id="brand"></span></button><nav aria-label="주 메뉴" id="nav"></nav></header>
<main id="main"></main>
<dialog id="lightbox" aria-labelledby="viewerTitle"><div class="viewer"><div class="viewer-top"><h2 id="viewerTitle"></h2><small id="viewerCount"></small><button class="icon" id="close" aria-label="작품 닫기">×</button></div><div class="viewer-body"><div class="stage" id="stage"><button class="icon arrow prev" id="prev" aria-label="이전 이미지">‹</button><button class="icon arrow next" id="next" aria-label="다음 이미지">›</button></div><aside class="side"><div class="eyebrow" id="viewerCategory"></div><p id="viewerDescription"></p><p id="viewerDate"></p><p id="viewerHint"></p><div class="thumbs" id="thumbs"></div></aside></div></div></dialog>
<div id="toast" role="status" hidden></div>
<script>
'use strict';
/* =============================================================
   내 홈페이지 수정하는 곳 — 아래 텍스트만 바꿔도 됩니다.
   작품별 수정은 projectOverrides의 폴더 경로를 기준으로 적용됩니다.
   publishedAt은 실제 공개일을 YYYY-MM-DD 형식으로 입력하세요.
   displayDate를 추가하면 카드 날짜를 직접 지정합니다. 비어 있으면 공개일 또는 폴더 날짜를 표시합니다.
   email은 본인 이메일로 교체하면 이메일 복사 버튼이 활성화됩니다.
   ============================================================= */
const CONFIG = {
  owner:'chunkbin', repo:'chunkbin123', branch:'main', imageRoot:'images',
  name:'chunkbin', role:'3D ART & VISUAL EXPLORATION',
  headline:'Form.\nTexture.\nLight.',
  intro:'공간과 사물의 디테일을 관찰하고,\n재질과 빛으로 새로운 장면을 만듭니다.',
  about:'3D Environment Artist\nTool:3ds Max, Photoshop, ',
  email:'chunkbin@naver.com',
  careers:[/* { company:'회사명', period:'2024 — 2026', description:'담당 업무' } */],
  projectOverrides:{
    'images/Personal/260318_Radio':{title:'Radio',description:'이곳에 작품 설명과 사용한 도구를 입력하세요.',publishedAt:''},
    'images/Personal/260415_Tile1':{title:'Tile 01',description:'이곳에 작품 설명을 입력하세요.',publishedAt:''},
    'images/Personal/260516_Tile2':{title:'Tile 02',description:'이곳에 작품 설명을 입력하세요.',publishedAt:''},
    'images/Personal/260902_Pillar':{title:'Pillar',description:'이곳에 작품 설명을 입력하세요.',publishedAt:''}
  },
  videos:[/* {id:'sketch-video-1',title:'영상 작품',category:'sketch',youtubeId:'유튜브_11자리_ID',description:'영상 설명',publishedAt:'2026-10-06'} */]
};
// 현재 공개 저장소에서 확인한 이미지. API 연결이 안 되어도 이 목록으로 표시합니다.
const KNOWN_PATHS = [
 'images/Personal/260318_Radio/Radio1_1.png','images/Personal/260318_Radio/Radio1_2.png',
 'images/Personal/260318_Radio/Radio1_3.png','images/Personal/260318_Radio/Radio1_4.png',
 'images/Personal/260318_Radio/Radio1_5.png','images/Personal/260415_Tile1/Tile1.png',
 'images/Personal/260516_Tile2/Tile2.png','images/Personal/260902_Pillar/Pillar1.png',
 'images/Personal/260902_Pillar/Pillar2.png'
];
const MENUS=[['home','Home'],['about','About']];
const LABELS=Object.fromEntries(MENUS);
const $=s=>document.querySelector(s);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
let projects=[], currentPage='home', query='', observer=null, visible=[], shown=0, pool=[], position=0, originFocus=null;
const main=$('#main'), dialog=$('#lightbox');
function classify(path){const p=path.split('/')[1]?.toLowerCase()||'';return /professional|company|workcompany/.test(p)?'professional':/sketch/.test(p)?'sketch':/designer/.test(p)?'designer':/relight|re.?lighting/.test(p)?'relight':'personal'}
function source(path){return 'https://raw.githubusercontent.com/'+[CONFIG.owner,CONFIG.repo,CONFIG.branch].map(encodeURIComponent).join('/')+'/'+path.split('/').map(encodeURIComponent).join('/')}
function makeProjects(paths){
 const groups=new Map();
 for(const path of paths){if(!path.startsWith(CONFIG.imageRoot+'/')||!/\.(png|jpe?g|webp|gif|avif)$/i.test(path))continue;
 const parts=path.split('/');const folder=parts.length>3?parts.slice(0,3).join('/'):parts.slice(0,-1).join('/');
 if(!groups.has(folder))groups.set(folder,[]);groups.get(folder).push(path)}
 const result=[...groups].map(([id,files])=>{files.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));const o=CONFIG.projectOverrides[id]||{};
 return {id,title:id.split('/').pop().replace(/^\d{6,8}[_-]?/,'').replace(/[_-]/g,' '),category:classify(id),description:'',publishedAt:'',company:'',...o,images:files.map(p=>({id:p,src:source(p),type:'image'}))}});
 for(const v of CONFIG.videos){if(!/^[\w-]{11}$/.test(v.youtubeId))continue;result.push({...v,images:[{id:v.id,type:'youtube',src:'https://www.youtube-nocookie.com/embed/'+v.youtubeId,thumb:'https://i.ytimg.com/vi/'+v.youtubeId+'/hqdefault.jpg'}]})}
 return result.sort((a,b)=>b.id.localeCompare(a.id,undefined,{numeric:true}));
}
function safeImage(src,alt,lazy=true){const i=el('img');i.src=src;i.alt=alt;i.loading=lazy?'lazy':'eager';i.decoding='async';i.addEventListener('error',()=>{i.classList.add('broken');i.alt=alt+' — 이미지를 불러오지 못했습니다.'},{once:true});return i}
function recent(p){if(!/^\d{4}-\d{2}-\d{2}$/.test(p.publishedAt||''))return false;const age=Date.now()-Date.parse(p.publishedAt+'T00:00:00+09:00');return age>=0&&age<30*864e5}
function flatten(items){return items.flatMap(p=>p.images.map(image=>({project:p,image})))}
function toast(message){const t=$('#toast');t.textContent=message;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,2200)}
async function copyEmail(){try{await navigator.clipboard.writeText(CONFIG.email);toast('이메일 주소를 복사했습니다.')}catch{window.prompt('이메일 주소를 복사해 주세요.',CONFIG.email)}}
function footer(){const f=el('footer','footer');const top=el('div','footer-top');const left=el('div');left.append(el('div','eyebrow','LET’S MAKE SOMETHING'),el('h2','','함께 만들 다음 장면.'));if(CONFIG.email){const b=el('button','pill','Email ↗');b.onclick=copyEmail;left.append(b)}const up=el('button','pill','Back to top ↑');up.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});top.append(left,up);const bottom=el('div','footer-bottom');bottom.append(el('span','',`© ${new Date().getFullYear()} ${CONFIG.name}`),el('span','','Selected works & ongoing explorations'));f.append(top,bottom);return f}
function displayDate(p){
 if(p.displayDate)return p.displayDate;
 if(p.publishedAt)return p.publishedAt;
 const token=(p.id.split('/').pop()||'').match(/^(\d{6})(?:_|-|$)/)?.[1];
 if(!token)return '';
 const value='20'+token.slice(0,2)+'-'+token.slice(2,4)+'-'+token.slice(4,6);
 const date=new Date(value+'T00:00:00Z');
 return !Number.isNaN(date.getTime())&&date.toISOString().slice(0,10)===value?value:'';
}
function card(p){
 const b=el('button','work-card');b.setAttribute('aria-label',p.title+' 작품 보기');
 const first=p.images[0];b.append(safeImage(first.thumb||first.src,p.title));
 const overlay=el('div','work-overlay');const date=displayDate(p);
 if(date){const t=el('time','',date.replaceAll('-','.'));t.dateTime=date;overlay.append(t)}
 overlay.append(el('h2','',p.title),el('span','work-arrow','↗'));b.append(overlay);
 b.onclick=()=>openProject(p);return b;
}
function renderAbout(){
 const section=el('section','about-page');section.append(el('p','eyebrow',CONFIG.role),el('h1','',CONFIG.name),el('p','lead',CONFIG.intro),el('p','about-copy',CONFIG.about));
 for(const c of CONFIG.careers){const row=el('div','career');row.append(el('span','',c.company),el('small','',c.period));section.append(row);if(c.description)section.append(el('p','notice',c.description))}
 const actions=el('div','actions');const works=el('button','pill primary','View works ↗');works.onclick=()=>navigate('home');actions.append(works);
 if(CONFIG.email){const email=el('button','pill','Email ↗');email.onclick=copyEmail;actions.append(email)}
 section.append(actions);main.append(section,footer());
}
function renderListing(){
 const head=el('section','home-heading'),title=el('div');title.append(el('p','eyebrow',CONFIG.role),el('h1','','Selected works'));head.append(title,el('p','archive-note','형태와 재질, 빛에 대한 기록.'));main.append(head);
 const toolbar=el('div','toolbar home-toolbar'),search=el('input');search.type='search';search.placeholder='작품명 검색';search.setAttribute('aria-label','작품명 검색');search.value=query;const count=el('span');toolbar.append(search,count);
 const grid=el('div','home-grid');grid.id='grid';const empty=el('div','empty');const sentinel=el('div','sentinel'),more=el('button','pill','더 보기 ↓');more.id='more';more.onclick=append;main.append(toolbar,grid,empty,more,sentinel,footer());
 function append(){const next=visible.slice(shown,shown+12);shown+=next.length;next.forEach(p=>grid.append(card(p)));more.hidden=shown>=visible.length}
 function update(){observer?.disconnect();grid.replaceChildren();shown=0;visible=projects.filter(p=>p.category==='personal'&&(p.title+' '+p.description).toLowerCase().includes(query.toLowerCase()));count.textContent=visible.length+' projects';empty.hidden=visible.length>0;empty.textContent=query?'검색 결과가 없습니다.':'아직 등록된 개인작업이 없습니다.';append();observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting))append()},{rootMargin:'450px'});observer.observe(sentinel)}
 search.oninput=()=>{query=search.value;update()};update();
}
function navigate(page,fromHash=false){if(!LABELS[page])page='home';currentPage=page;query='';if(!fromHash&&location.hash!=='#'+page)history.pushState(null,'','#'+page);render();window.scrollTo(0,0)}
function render(){observer?.disconnect();main.replaceChildren();document.querySelectorAll('#nav button').forEach(b=>{b.classList.toggle('active',b.dataset.nav===currentPage);if(b.dataset.nav===currentPage)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});currentPage==='about'?renderAbout():renderListing()}
function openProject(p){openItems(flatten([p]),0,false)}
function openItems(items,index){if(!items.length)return;originFocus=document.activeElement;pool=items;position=Math.max(0,index);document.body.style.overflow='hidden';dialog.showModal();renderViewer();$('#close').focus()}
let zoom=1,panX=0,panY=0,zoomViewport=null,zoomImage=null,zoomLabel=null,drag=null,zoomTimer=null;
function clampPan(){
 if(!zoomViewport||!zoomImage)return;
 const w=zoomViewport.clientWidth,h=zoomViewport.clientHeight;
 const nw=zoomImage.naturalWidth||w,nh=zoomImage.naturalHeight||h;
 const fit=Math.min(w/nw,h/nh),maxX=Math.max(0,(nw*fit*zoom-w)/2),maxY=Math.max(0,(nh*fit*zoom-h)/2);
 panX=Math.max(-maxX,Math.min(maxX,panX));panY=Math.max(-maxY,Math.min(maxY,panY));
}
function paintZoom(animated=false){
 if(!zoomViewport||!zoomImage)return;clampPan();clearTimeout(zoomTimer);zoomViewport.classList.toggle('animating',animated);if(animated)zoomTimer=setTimeout(()=>zoomViewport?.classList.remove('animating'),230);
 zoomImage.style.transform=`translate(${panX}px, ${panY}px) scale(${zoom})`;zoomViewport.classList.toggle('zoomed',zoom>1);zoomViewport.setAttribute('aria-label',zoom>1?'확대된 이미지. 드래그로 이동, Enter로 원래 크기':'이미지 클릭 또는 Enter로 확대');zoomViewport.setAttribute('aria-pressed',String(zoom>1));if(zoomLabel)zoomLabel.textContent=Math.round(zoom*100)+'%';
}
function setZoom(value,point=null,animated=true){
 const old=zoom;zoom=Math.max(1,Math.min(5,value));
 if(point&&zoomViewport){const r=zoomViewport.getBoundingClientRect(),x=point.x-r.left-r.width/2,y=point.y-r.top-r.height/2;panX=x-(x-panX)*zoom/old;panY=y-(y-panY)*zoom/old}
 if(zoom===1){panX=0;panY=0}paintZoom(animated);
}
function toggleZoom(){setZoom(zoom>1?1:2)}
function resetZoom(){zoom=1;panX=0;panY=0;drag=null;zoomViewport=null;zoomImage=null;zoomLabel=null;clearTimeout(zoomTimer)}
function installZoom(stage,image,title){
 const vp=el('div','image-viewport');vp.tabIndex=0;vp.setAttribute('role','button');
 const img=safeImage(image.src,title,false);img.draggable=false;vp.append(img);stage.prepend(vp);zoomViewport=vp;zoomImage=img;
 const controls=el('div','zoom-controls');controls.setAttribute('aria-label','이미지 확대 도구');
 const minus=el('button','','−'),plus=el('button','','+'),fit=el('button','fit','원래 크기');minus.setAttribute('aria-label','이미지 축소');plus.setAttribute('aria-label','이미지 확대');
 zoomLabel=el('output','','100%');minus.onclick=()=>setZoom(zoom-.5);plus.onclick=()=>setZoom(zoom+.5);fit.onclick=()=>setZoom(1);controls.append(minus,zoomLabel,plus,fit);stage.append(controls);
 img.addEventListener('load',()=>paintZoom());
 vp.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleZoom()}});
 vp.addEventListener('pointerdown',e=>{if(e.button!==0||!e.isPrimary)return;vp.focus({preventScroll:true});vp.setPointerCapture(e.pointerId);drag={id:e.pointerId,x:e.clientX,y:e.clientY,px:panX,py:panY,moved:false,wasZoomed:zoom>1};vp.classList.add('dragging');vp.classList.remove('animating')});
 vp.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>6)drag.moved=true;if(drag.wasZoomed){panX=drag.px+dx;panY=drag.py+dy;paintZoom(false)}});
 vp.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;vp.classList.remove('dragging');if(vp.hasPointerCapture(e.pointerId))vp.releasePointerCapture(e.pointerId);
 if(!d.moved){if(zoom>1)setZoom(1);else setZoom(2,{x:e.clientX,y:e.clientY})}
 else if(!d.wasZoomed&&e.pointerType==='touch'){const dx=e.clientX-d.x,dy=e.clientY-d.y;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)move(dx<0?1:-1)}});
 const cancel=()=>{drag=null;vp.classList.remove('dragging')};vp.addEventListener('pointercancel',cancel);vp.addEventListener('lostpointercapture',cancel);
 vp.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoom*Math.exp(-e.deltaY*.002),{x:e.clientX,y:e.clientY},false)},{passive:false});paintZoom();
}
function renderViewer(){
 resetZoom();const {project:p,image}=pool[position];$('#viewerTitle').textContent=p.title;$('#viewerCount').textContent=(position+1)+' / '+pool.length;
 $('#viewerCategory').textContent='PROJECT / '+p.title;$('#viewerDescription').textContent=p.description||'';$('#viewerDate').textContent=displayDate(p);$('#viewerHint').textContent='이미지 클릭: 확대 · 드래그: 이동\n휠 또는 +/−: 배율 조절\n방향키: 이 작품의 이전·다음 사진';
 const stage=$('#stage');stage.querySelectorAll('.image-viewport,.zoom-controls,iframe,.video-wheel').forEach(e=>e.remove());
 if(image.type==='youtube'){const iframe=el('iframe');iframe.title=p.title;iframe.src=image.src;iframe.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture';iframe.allowFullscreen=true;stage.prepend(iframe)}else installZoom(stage,image,p.title);
 const thumbs=$('#thumbs');thumbs.replaceChildren();pool.forEach((item,i)=>{const b=el('button','thumb'+(i===position?' selected':''));b.setAttribute('aria-label',item.project.title+' 사진 '+(i+1));b.setAttribute('aria-pressed',String(i===position));b.append(safeImage(item.image.thumb||item.image.src,item.project.title));b.onclick=()=>{position=i;renderViewer();$('#thumbs').children[i]?.focus({preventScroll:true})};thumbs.append(b)});
 $('#prev').disabled=$('#next').disabled=pool.length<2;$('#prev').hidden=$('#next').hidden=pool.length<2;
}
function move(dir){if(pool.length<2)return;position=(position+dir+pool.length)%pool.length;renderViewer();}
function closeViewer(){dialog.close()}
$('#close').onclick=closeViewer;
dialog.addEventListener('cancel',e=>{if(zoom>1){e.preventDefault();setZoom(1)}});
dialog.addEventListener('close',()=>{resetZoom();document.body.style.overflow='';$('#stage').querySelectorAll('iframe').forEach(e=>e.remove());originFocus?.focus({preventScroll:true})});
$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
dialog.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();move(e.key==='ArrowRight'?1:-1)}else if((e.key==='+'||e.key==='=')&&zoomViewport){e.preventDefault();setZoom(zoom+.5)}else if(e.key==='-'&&zoomViewport){e.preventDefault();setZoom(zoom-.5)}});
window.addEventListener('resize',()=>paintZoom());
window.addEventListener('popstate',()=>{if(dialog.open)dialog.close();navigate(location.hash.slice(1)||'home',true)});
$('#brand').textContent=CONFIG.name;document.title=CONFIG.name+' — Portfolio';MENUS.forEach(([id,label])=>{const b=el('button','',label);b.dataset.nav=id;b.onclick=()=>navigate(id);$('#nav').append(b)});document.querySelector('.brand').onclick=()=>navigate('home');
const cacheKey='portfolio-paths:'+CONFIG.owner+'/'+CONFIG.repo+'/'+CONFIG.branch;let paths=KNOWN_PATHS;try{const c=JSON.parse(localStorage.getItem(cacheKey)||'null');if(Array.isArray(c?.paths)&&c.paths.length)paths=c.paths}catch{}
projects=makeProjects(paths);navigate(LABELS[location.hash.slice(1)]?location.hash.slice(1):'home',true);
async function refreshPaths(){try{const response=await fetch('https://api.github.com/repos/'+encodeURIComponent(CONFIG.owner)+'/'+encodeURIComponent(CONFIG.repo)+'/git/trees/'+encodeURIComponent(CONFIG.branch)+'?recursive=1',{signal:AbortSignal.timeout(12000)});if(!response.ok)throw Error('GitHub '+response.status);const data=await response.json();if(data.truncated||!Array.isArray(data.tree))throw Error('Incomplete tree');const next=data.tree.filter(x=>x.type==='blob'&&x.path.startsWith(CONFIG.imageRoot+'/')&&/\.(png|jpe?g|webp|gif|avif)$/i.test(x.path)).map(x=>x.path);if(!next.length)return;try{localStorage.setItem(cacheKey,JSON.stringify({paths:next,time:Date.now()}))}catch{}if(JSON.stringify([...paths].sort())!==JSON.stringify([...next].sort())){projects=makeProjects(next);if(!dialog.open&&!query&&window.scrollY<20)render()}}catch(error){console.info('저장된 작품 목록을 사용합니다.',error.message)}}
refreshPaths();
</script>
