<style>
:root{color-scheme:dark;--bg:#101312;--panel:#191e1b;--line:#303831;--text:#eef0e8;--muted:#9ca69b;--accent:#d5ed9c;font-family:Arial,'Malgun Gothic',sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,a,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{color:inherit;cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:5px}button{background:none;border:0}a{color:inherit;text-decoration:none}header{position:sticky;top:0;z-index:20;background:#101312f5;border-bottom:1px solid var(--line);padding:0 4.5vw;display:flex;align-items:center;gap:32px;min-height:84px}.brand{font-size:20px;font-weight:800;letter-spacing:-1px;white-space:nowrap}.brand i{display:inline-block;width:9px;height:9px;margin-right:10px;background:var(--accent);border-radius:50%}nav{display:flex;gap:22px;overflow:auto;margin-left:auto;scrollbar-width:none}nav button{font-size:12px;white-space:nowrap;padding:32px 0;color:var(--muted);border-bottom:2px solid transparent}nav button.active{color:var(--accent);border-color:var(--accent)}main{max-width:1680px;margin:auto;padding:0 4.5vw}.eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:2px;color:var(--accent);margin:0 0 22px}.hero{padding:76px 0 60px;display:grid;grid-template-columns:1fr 1.05fr;gap:7vw;align-items:center}.hero h1{font-weight:500;font-size:clamp(48px,6.8vw,108px);line-height:1.01;letter-spacing:-.065em;margin:0 0 30px;white-space:pre-line}.hero h1 em{font-style:normal;color:var(--accent)}.lead{font-size:15px;line-height:1.95;color:var(--muted);max-width:480px;white-space:pre-line}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}.pill{border:1px solid var(--line);border-radius:30px;padding:13px 21px;font-size:12px}.pill.primary{background:var(--accent);color:#18200e;border-color:var(--accent)}.feature{padding:0;text-align:left;width:100%}.feature-frame{aspect-ratio:1.15;background:var(--panel);overflow:hidden;border-radius:3px}.feature img{width:100%;height:100%;object-fit:cover;transition:transform .7s}.feature:hover img{transform:scale(1.035)}.caption{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding-top:15px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:24px 0}.section-head h2{font-size:clamp(28px,3vw,42px);font-weight:400;letter-spacing:-1.5px;margin:0}.section-head p{font-size:12px;color:var(--muted)}.section{padding:40px 0 64px;border-top:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 24px}.card{text-align:left;padding:0;min-width:0}.image-wrap{aspect-ratio:4/3;background:var(--panel);overflow:hidden;position:relative;border-radius:3px}.card img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.card:hover img{transform:scale(1.045)}.image-wrap:after{content:'↗';position:absolute;bottom:12px;right:14px;font-size:24px;color:white;text-shadow:0 1px 8px #000}.card-meta{position:relative;padding-top:16px}.card h3{font-size:16px;font-weight:400;margin:0 0 7px}.card small{font-size:10px;color:var(--muted);letter-spacing:1px}.date{position:absolute;bottom:100%;left:0;padding:9px 12px;background:#101312c9;font-size:11px;opacity:0;transition:opacity .2s}.card:hover .date,.card:focus-visible .date{opacity:1}.badge{position:absolute;top:12px;left:12px;padding:6px 9px;border-radius:2px;background:var(--accent);color:#18200e;font-size:10px}.bio{display:grid;grid-template-columns:1fr 2fr;gap:50px}.bio p{color:var(--muted);font-size:16px;line-height:1.95;white-space:pre-line;margin-top:0}.career{display:flex;justify-content:space-between;width:100%;text-align:left;padding:20px 0;border-bottom:1px solid var(--line)}.career small{color:var(--muted)}.page-title{padding:65px 0 25px}.page-title h1{font-size:clamp(40px,6vw,76px);font-weight:400;letter-spacing:-3px;margin:0 0 16px}.page-title p{color:var(--muted);line-height:1.8}.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:16px 0 32px}.toolbar input{background:var(--panel);border:1px solid var(--line);border-radius:30px;padding:12px 18px;color:var(--text);width:min(100%,300px)}.toolbar span{margin-left:auto;color:var(--muted);font-size:12px}.empty{padding:75px 15px;text-align:center;border:1px dashed var(--line);color:var(--muted);line-height:1.9}.notice{color:var(--muted);font-size:12px;line-height:1.8;margin:15px 0}.footer{margin-top:60px;border-top:1px solid var(--line);padding:42px 0 24px}.footer-top{display:flex;justify-content:space-between;align-items:center;gap:20px}.footer h2{font-size:clamp(32px,4vw,60px);font-weight:400;letter-spacing:-2px;margin:0 0 22px}.footer-bottom{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;gap:20px;margin-top:55px}.footer button{text-align:left}.sentinel{height:8px}#more{display:block;margin:25px auto}dialog{width:100vw;height:100dvh;max-width:none;max-height:none;border:0;padding:0;background:#0c0e0d;color:var(--text)}dialog::backdrop{background:#000}.viewer{height:100%;display:grid;grid-template-rows:70px minmax(0,1fr)}.viewer-top{display:flex;align-items:center;gap:20px;padding:0 25px;border-bottom:1px solid var(--line)}.viewer-top h2{font-weight:400;font-size:16px;margin:0;flex:1}.viewer-top small{color:var(--muted);font-size:11px}.icon{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;font-size:23px}.viewer-body{display:grid;grid-template-columns:minmax(0,1fr) 260px;min-height:0}.stage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;touch-action:pan-y}.stage>img,.stage>iframe{width:100%;height:100%;object-fit:contain;border:0}.arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:#101312c9}.prev{left:18px}.next{right:18px}.side{border-left:1px solid var(--line);padding:22px;overflow:auto}.side p{font-size:12px;color:var(--muted);line-height:1.8;white-space:pre-line}.thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:24px}.thumb{padding:0;border:2px solid transparent;aspect-ratio:4/3;overflow:hidden;background:var(--panel)}.thumb.selected{border-color:var(--accent)}.thumb img{width:100%;height:100%;object-fit:cover}.video-wheel{position:absolute;top:5px;left:50%;transform:translateX(-50%);padding:8px 12px;background:#101312dc;font-size:11px;z-index:3}#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:white;color:#151515;padding:18px 26px;border-radius:8px;box-shadow:0 8px 60px #0006;z-index:100;font-size:14px;text-align:center;max-width:90vw}.hidden,[hidden]{display:none!important}.broken{object-fit:contain!important;opacity:.55}@media(min-width:1200px){.grid.all{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:950px){header{flex-wrap:wrap;gap:0;padding-top:18px}.brand{width:100%}nav{margin:0;gap:22px;width:100%}nav button{padding:20px 0}.hero{gap:30px;padding-top:45px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.viewer-body{grid-template-columns:minmax(0,1fr) 210px}}@media(max-width:620px){.hero{grid-template-columns:1fr;padding-top:38px}.hero h1{font-size:64px}.hero .lead{font-size:14px}.feature-frame{aspect-ratio:4/3}.grid{gap:25px 14px}.card h3{font-size:14px}.bio{grid-template-columns:1fr;gap:10px}.section{padding:30px 0 40px}.section-head h2{font-size:29px}.viewer-body{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 165px}.side{border-left:0;border-top:1px solid var(--line);padding:12px 16px}.side p{display:none}.thumbs{display:flex;margin:10px 0 0;overflow:auto}.thumb{min-width:72px;width:72px;height:54px}.viewer-top{padding:0 12px;gap:10px}.viewer-top small{display:none}.footer-top{align-items:start}.footer-bottom{line-height:1.7}.date{display:none}.prev{left:8px}.next{right:8px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<body>
<header><button class="brand" data-nav="about"><i></i><span id="brand"></span></button><nav aria-label="주 메뉴" id="nav"></nav></header>
<main id="main"></main>
<dialog id="lightbox" aria-labelledby="viewerTitle"><div class="viewer"><div class="viewer-top"><h2 id="viewerTitle"></h2><small id="viewerCount"></small><button class="icon" id="close" aria-label="작품 닫기">×</button></div><div class="viewer-body"><div class="stage" id="stage"><button class="icon arrow prev" id="prev" aria-label="이전 이미지">‹</button><button class="icon arrow next" id="next" aria-label="다음 이미지">›</button></div><aside class="side"><div class="eyebrow" id="viewerCategory"></div><p id="viewerDescription"></p><p id="viewerDate"></p><p id="viewerHint"></p><div class="thumbs" id="thumbs"></div></aside></div></div></dialog>
<div id="toast" role="status" hidden></div>
<script>
'use strict';
/* =============================================================
   내 홈페이지 수정하는 곳 — 아래 텍스트만 바꿔도 됩니다.
   작품별 수정은 projectOverrides의 폴더 경로를 기준으로 적용됩니다.
   publishedAt은 실제 공개일을 YYYY-MM-DD 형식으로 입력하세요.
   email은 본인 이메일로 교체하면 이메일 복사 버튼이 활성화됩니다.
   ============================================================= */
const CONFIG = {
  owner:'chunkbin123', repo:'chunkbin123', branch:'main', imageRoot:'images',
  name:'chunkbin123', role:'3D ART & VISUAL EXPLORATION',
  headline:'Form.\nTexture.\nLight.',
  intro:'공간과 사물의 디테일을 관찰하고,\n재질과 빛으로 새로운 장면을 만듭니다.',
  about:'이곳에 자기소개를 입력하세요.\n관심 있는 작업 분야, 작업 방식, 사용하는 도구 등을 자유롭게 소개할 수 있습니다.',
  email:'',
  careers:[/* { company:'회사명', period:'2024 — 2026', description:'담당 업무' } */],
  projectOverrides:{
    'images/Personal/260318_Radio':{title:'Radio',description:'이곳에 작품 설명과 사용한 도구를 입력하세요.',publishedAt:''},
    'images/Personal/260415_Tile1':{title:'Tile 01',description:'이곳에 작품 설명을 입력하세요.',publishedAt:''},
    'images/Personal/260516_Tile2':{title:'Tile 02',description:'이곳에 작품 설명을 입력하세요.',publishedAt:''},
    'images/Personal/260902_Pillar':{title:'Pillar',description:'이곳에 작품 설명을 입력하세요.',publishedAt:''}
  },
  videos:[/* {id:'sketch-video-1',title:'영상 작품',category:'sketch',youtubeId:'유튜브_11자리_ID',description:'영상 설명',publishedAt:'2026-10-06'} */]
};
// 현재 공개 저장소에서 확인한 이미지. API 연결이 안 되어도 이 목록으로 표시합니다.
const KNOWN_PATHS = [
 'images/Personal/260318_Radio/Radio1_1.png','images/Personal/260318_Radio/Radio1_2.png',
 'images/Personal/260318_Radio/Radio1_3.png','images/Personal/260318_Radio/Radio1_4.png',
 'images/Personal/260318_Radio/Radio1_5.png','images/Personal/260415_Tile1/Tile1.png',
 'images/Personal/260516_Tile2/Tile2.png','images/Personal/260902_Pillar/Pillar1.png',
 'images/Personal/260902_Pillar/Pillar2.png'
];
const MENUS=[['about','About'],['all','ALL Portfolio'],['professional','Professional'],['personal','Personal Works'],['sketch','Sketch'],['designer','Designer'],['relight','Re:Lighting']];
const LABELS=Object.fromEntries(MENUS);
const $=s=>document.querySelector(s);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
let projects=[], currentPage='about', query='', observer=null, visible=[], shown=0, pool=[], position=0, randomMode=false, lastWheel=0, originFocus=null;
const main=$('#main'), dialog=$('#lightbox');
function classify(path){const p=path.split('/')[1]?.toLowerCase()||'';return /professional|company|workcompany/.test(p)?'professional':/sketch/.test(p)?'sketch':/designer/.test(p)?'designer':/relight|re.?lighting/.test(p)?'relight':'personal'}
function source(path){return 'https://raw.githubusercontent.com/'+[CONFIG.owner,CONFIG.repo,CONFIG.branch].map(encodeURIComponent).join('/')+'/'+path.split('/').map(encodeURIComponent).join('/')}
function makeProjects(paths){
 const groups=new Map();
 for(const path of paths){if(!path.startsWith(CONFIG.imageRoot+'/')||!/\.(png|jpe?g|webp|gif|avif)$/i.test(path))continue;
 const parts=path.split('/');const folder=parts.length>3?parts.slice(0,3).join('/'):parts.slice(0,-1).join('/');
 if(!groups.has(folder))groups.set(folder,[]);groups.get(folder).push(path)}
 const result=[...groups].map(([id,files])=>{files.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));const o=CONFIG.projectOverrides[id]||{};
 return {id,title:id.split('/').pop().replace(/^\d{6,8}[_-]?/,'').replace(/[_-]/g,' '),category:classify(id),description:'',publishedAt:'',company:'',...o,images:files.map(p=>({id:p,src:source(p),type:'image'}))}});
 for(const v of CONFIG.videos){if(!/^[\w-]{11}$/.test(v.youtubeId))continue;result.push({...v,images:[{id:v.id,type:'youtube',src:'https://www.youtube-nocookie.com/embed/'+v.youtubeId,thumb:'https://i.ytimg.com/vi/'+v.youtubeId+'/hqdefault.jpg'}]})}
 return result.sort((a,b)=>b.id.localeCompare(a.id,undefined,{numeric:true}));
}
function safeImage(src,alt,lazy=true){const i=el('img');i.src=src;i.alt=alt;i.loading=lazy?'lazy':'eager';i.decoding='async';i.addEventListener('error',()=>{i.classList.add('broken');i.alt=alt+' — 이미지를 불러오지 못했습니다.'},{once:true});return i}
function recent(p){if(!/^\d{4}-\d{2}-\d{2}$/.test(p.publishedAt||''))return false;const age=Date.now()-Date.parse(p.publishedAt+'T00:00:00+09:00');return age>=0&&age<30*864e5}
function flatten(items){return items.flatMap(p=>p.images.map(image=>({project:p,image})))}
function toast(message){const t=$('#toast');t.textContent=message;t.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.hidden=true,2200)}
async function copyEmail(){try{await navigator.clipboard.writeText(CONFIG.email);toast('이메일 주소를 복사했습니다.')}catch{window.prompt('이메일 주소를 복사해 주세요.',CONFIG.email)}}
function footer(){const f=el('footer','footer');const top=el('div','footer-top');const left=el('div');left.append(el('div','eyebrow','LET’S MAKE SOMETHING'),el('h2','','함께 만들 다음 장면.'));if(CONFIG.email){const b=el('button','pill','Email ↗');b.onclick=copyEmail;left.append(b)}const up=el('button','pill','Back to top ↑');up.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});top.append(left,up);const bottom=el('div','footer-bottom');bottom.append(el('span','',`© ${new Date().getFullYear()} ${CONFIG.name}`),el('span','','Selected works & ongoing explorations'));f.append(top,bottom);return f}
function card(p,all=false){const b=el('button','card');b.setAttribute('aria-label',p.title+' 작품 보기');const wrap=el('div','image-wrap');const image=p.images[0];wrap.append(safeImage(image.thumb||image.src,p.title));if(recent(p))wrap.append(el('span','badge','NEW'));const meta=el('div','card-meta');if(p.publishedAt)meta.append(el('span','date',p.publishedAt));meta.append(el('h3','',p.title),el('small','',(LABELS[p.category]||p.category).toUpperCase()));b.append(wrap,meta);b.onclick=()=>openProject(p,all);return b}
function sectionHead(title,subtitle){const h=el('div','section-head');h.append(el('h2','',title));if(subtitle)h.append(el('p','',subtitle));return h}
function renderAbout(){const hero=el('section','hero');const text=el('div');text.append(el('p','eyebrow',CONFIG.role),el('h1','',CONFIG.headline),el('p','lead',CONFIG.intro));const actions=el('div','actions');const works=el('button','pill primary','Explore works ↗');works.onclick=()=>navigate('all');const pro=el('button','pill','Professional →');pro.onclick=()=>navigate('professional');actions.append(works,pro);text.append(actions);hero.append(text);
 if(projects.length){const p=projects[0],b=el('button','feature');const frame=el('div','feature-frame');frame.append(safeImage(p.images[0].thumb||p.images[0].src,p.title,false));const cap=el('div','caption');cap.append(el('span','','FEATURED / '+p.title),el('span','','VIEW PROJECT ↗'));b.append(frame,cap);b.onclick=()=>openProject(p);hero.append(b)}
 main.append(hero);const selected=el('section','section');selected.append(sectionHead('Selected works','작품을 클릭하면 크게 볼 수 있습니다.'));const grid=el('div','grid');projects.slice(0,6).forEach(p=>grid.append(card(p)));selected.append(grid);main.append(selected);
 const bio=el('section','section bio');bio.append(el('h2','','About me'));const info=el('div');info.append(el('p','',CONFIG.about));for(const c of CONFIG.careers){const b=el('button','career');b.append(el('span','',c.company+' ↗'),el('small','',c.period));b.title=c.description||'';b.onclick=()=>{const list=projects.filter(p=>p.company===c.company);if(list.length)openItems(flatten(list),0,false);else toast('이 회사에 연결된 작품이 아직 없습니다.')};info.append(b)}bio.append(info);main.append(bio,footer())}
function renderListing(){const head=el('section','page-title');head.append(el('p','eyebrow','THE WORK ARCHIVE'),el('h1','',LABELS[currentPage]),el('p','',currentPage==='all'?'모든 작업을 한곳에서. 이미지 확대 후 마우스 휠로 다른 작품을 발견해 보세요.':'작품을 열어 같은 카테고리의 작업을 순서대로 살펴보세요.'));main.append(head);
 const toolbar=el('div','toolbar'),search=el('input');search.type='search';search.placeholder='작품명 검색';search.setAttribute('aria-label','작품명 검색');search.value=query;const count=el('span');toolbar.append(search,count);const grid=el('div','grid'+(currentPage==='all'?' all':''));grid.id='grid';const empty=el('div','empty');empty.hidden=true;const sentinel=el('div','sentinel');const more=el('button','pill','더 보기 ↓');more.id='more';more.onclick=append;main.append(toolbar,grid,empty,more,sentinel,footer());
 function update(){observer?.disconnect();grid.replaceChildren();shown=0;visible=projects.filter(p=>(currentPage==='all'||p.category===currentPage)&&(p.title+' '+p.description+' '+p.company).toLowerCase().includes(query.toLowerCase()));count.textContent=visible.length+' projects';empty.hidden=visible.length>0;empty.textContent=query?'검색 결과가 없습니다.':'아직 등록된 작품이 없습니다.';append();observer=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting))append()},{rootMargin:'450px'});observer.observe(sentinel)}
 function append(){const next=visible.slice(shown,shown+12);shown+=next.length;next.forEach(p=>grid.append(card(p,currentPage==='all')));more.hidden=shown>=visible.length}
 search.oninput=()=>{query=search.value;update()};update();
}
function navigate(page,fromHash=false){if(!LABELS[page])page='about';currentPage=page;query='';if(!fromHash&&location.hash!=='#'+page)history.pushState(null,'','#'+page);render();window.scrollTo(0,0)}
function render(){observer?.disconnect();main.replaceChildren();document.querySelectorAll('#nav button').forEach(b=>{b.classList.toggle('active',b.dataset.nav===currentPage);if(b.dataset.nav===currentPage)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});currentPage==='about'?renderAbout():renderListing()}
function openProject(p,all=false){const items=flatten(all?projects:projects.filter(x=>x.category===p.category));openItems(items,items.findIndex(x=>x.project.id===p.id),all)}
function openItems(items,index,random){if(!items.length)return;originFocus=document.activeElement;pool=items;position=Math.max(0,index);randomMode=random;lastWheel=0;document.body.style.overflow='hidden';dialog.showModal();renderViewer();$('#close').focus()}
function renderViewer(){const {project:p,image}=pool[position];$('#viewerTitle').textContent=p.title;$('#viewerCount').textContent=(position+1)+' / '+pool.length;$('#viewerCategory').textContent=(LABELS[p.category]||p.category).toUpperCase();$('#viewerDescription').textContent=p.description||'';$('#viewerDate').textContent=p.publishedAt?'공개일 '+p.publishedAt:'';$('#viewerHint').textContent=randomMode?'휠: 다른 작품 랜덤 탐색 · 방향키: 순차 이동':'휠 · 방향키로 같은 카테고리 순차 이동';const stage=$('#stage');stage.querySelectorAll('img,iframe,.video-wheel').forEach(e=>e.remove());if(image.type==='youtube'){const iframe=el('iframe');iframe.title=p.title;iframe.src=image.src;iframe.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture';iframe.allowFullscreen=true;stage.prepend(iframe);const overlay=el('div','video-wheel','이 영역에서 휠로 작품 이동');stage.append(overlay)}else stage.prepend(safeImage(image.src,p.title,false));const thumbs=$('#thumbs');thumbs.replaceChildren();pool.forEach((item,i)=>{const b=el('button','thumb'+(i===position?' selected':''));b.setAttribute('aria-label',item.project.title+' 이미지 '+(i+1));b.setAttribute('aria-pressed',String(i===position));b.append(safeImage(item.image.thumb||item.image.src,item.project.title));b.onclick=()=>{position=i;renderViewer()};thumbs.append(b)});$('#prev').disabled=$('#next').disabled=pool.length<2}
function move(dir,random=false){if(pool.length<2)return;if(random){const ids=[...new Set(pool.map(x=>x.project.id))].filter(id=>id!==pool[position].project.id);if(ids.length){const id=ids[Math.floor(Math.random()*ids.length)];position=pool.findIndex(x=>x.project.id===id)}else position=(position+dir+pool.length)%pool.length}else position=(position+dir+pool.length)%pool.length;renderViewer()}
function closeViewer(){dialog.close()}
$('#close').onclick=closeViewer;dialog.addEventListener('close',()=>{document.body.style.overflow='';$('#stage').querySelectorAll('iframe').forEach(e=>e.remove());originFocus?.focus({preventScroll:true})});$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);
dialog.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();move(e.key==='ArrowRight'?1:-1)}});
$('#stage').addEventListener('wheel',e=>{e.preventDefault();const now=performance.now();if(Math.abs(e.deltaY)<8||now-lastWheel<450)return;lastWheel=now;move(e.deltaY>0?1:-1,randomMode)},{passive:false});
let touchStart=null;$('#stage').addEventListener('touchstart',e=>{touchStart=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});$('#stage').addEventListener('touchend',e=>{if(!touchStart)return;const dx=e.changedTouches[0].clientX-touchStart[0],dy=e.changedTouches[0].clientY-touchStart[1];if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)move(dx<0?1:-1);touchStart=null},{passive:true});
window.addEventListener('popstate',()=>{if(dialog.open)dialog.close();navigate(location.hash.slice(1)||'about',true)});
$('#brand').textContent=CONFIG.name;document.title=CONFIG.name+' — Portfolio';MENUS.forEach(([id,label])=>{const b=el('button','',label);b.dataset.nav=id;b.onclick=()=>navigate(id);$('#nav').append(b)});document.querySelector('.brand').onclick=()=>navigate('about');
const cacheKey='portfolio-paths:'+CONFIG.owner+'/'+CONFIG.repo+'/'+CONFIG.branch;let paths=KNOWN_PATHS;try{const c=JSON.parse(localStorage.getItem(cacheKey)||'null');if(Array.isArray(c?.paths)&&c.paths.length)paths=c.paths}catch{}
projects=makeProjects(paths);navigate(LABELS[location.hash.slice(1)]?location.hash.slice(1):'about',true);
async function refreshPaths(){try{const response=await fetch('https://api.github.com/repos/'+encodeURIComponent(CONFIG.owner)+'/'+encodeURIComponent(CONFIG.repo)+'/git/trees/'+encodeURIComponent(CONFIG.branch)+'?recursive=1',{signal:AbortSignal.timeout(12000)});if(!response.ok)throw Error('GitHub '+response.status);const data=await response.json();if(data.truncated||!Array.isArray(data.tree))throw Error('Incomplete tree');const next=data.tree.filter(x=>x.type==='blob'&&x.path.startsWith(CONFIG.imageRoot+'/')&&/\.(png|jpe?g|webp|gif|avif)$/i.test(x.path)).map(x=>x.path);if(!next.length)return;try{localStorage.setItem(cacheKey,JSON.stringify({paths:next,time:Date.now()}))}catch{}if(JSON.stringify([...paths].sort())!==JSON.stringify([...next].sort())){projects=makeProjects(next);if(!dialog.open&&!query)render()}}catch(error){console.info('저장된 작품 목록을 사용합니다.',error.message)}}
refreshPaths();
</script>
</body></html>
